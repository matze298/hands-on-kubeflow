apiVersion: batch/v1
kind: Job
metadata:
  name: crashing-job
  namespace: kubeflow-by-doing
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: crash
          image: python:3.12-slim
          command:
            - python
            - -c
            - |
              print("starting")
              raise RuntimeError("simulated training failure")
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
