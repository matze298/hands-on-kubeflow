[project]
name = "kubeflow-hands-on"
version = "0.1.0"
description = "Local-first Kubeflow tutorial project."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flyte[tui]>=2.4.4",
    "kfp>=2.16.1",
    "rich>=15.0.0",
    "torch>=2.12.0",
    "typer>=0.26.7",
]

[project.scripts]
kbd = "kubeflow_by_doing.cli:app"

[dependency-groups]
docs = [
    "mkdocs-material>=9.7.6",
]

dev = [
    "marimo>=0.23.9",
    "prek>=0.4.1",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "ty>=0.0.38",
    "typer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kubeflow_by_doing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
