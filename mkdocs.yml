      - Run a Pipeline from Python: 02-kubeflow-pipelines/03-run-pipeline-from-python.md
      - Components, Parameters, and Artifacts: 02-kubeflow-pipelines/04-components-parameters-artifacts.md
      - Reusable Components: 02-kubeflow-pipelines/05-reusable-components.md
      - Debugging KFP Runs: 02-kubeflow-pipelines/06-debugging-kfp-runs.md
  - 3. Local ML Workflow:
