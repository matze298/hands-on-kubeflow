apiVersion: batch/v1
kind: Job
metadata:
  name: broken-image-job
  namespace: kubeflow-by-doing
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: broken
          image: does-not-exist.example.com/ml/train:missing
          command: ["python", "-c", "print('this will not run')"]
