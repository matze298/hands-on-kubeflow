# PIPELINE DEFINITION
# Name: image-classification-local
# Description: Define the local image classification pipeline.
# Inputs:
#    batch_size: int [Default: 32.0]
#    epochs: int [Default: 2.0]
#    learning_rate: float [Default: 0.001]
#    min_accuracy: float [Default: 0.8]
#    n_train: int [Default: 256.0]
#    n_val: int [Default: 64.0]
#    seed: int [Default: 42.0]
components:
  comp-condition-1:
    dag:
      tasks:
        promote-model:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-promote-model
          inputs:
            artifacts:
              model:
                componentInputArtifact: pipelinechannel--train-model-model
            parameters:
              accuracy:
                componentInputParameter: pipelinechannel--read-accuracy-Output
              min_accuracy:
                componentInputParameter: pipelinechannel--min_accuracy
          taskInfo:
            name: promote-model
    inputDefinitions:
      artifacts:
        pipelinechannel--train-model-model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--min_accuracy:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--read-accuracy-Output:
          parameterType: NUMBER_DOUBLE
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        batch_size:
          defaultValue: 32.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        n_train:
          defaultValue: 256.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        n_val:
          defaultValue: 64.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        seed:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        metrics_artifact:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-promote-model:
    executorLabel: exec-promote-model
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
          description: Trained model artifact produced by the training component.
      parameters:
        accuracy:
          description: Evaluation accuracy for the trained model.
          parameterType: NUMBER_DOUBLE
        min_accuracy:
          defaultValue: 0.8
          description: Minimum accuracy required before the model is promoted.
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        promotion:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-read-accuracy:
    executorLabel: exec-read-accuracy
    inputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Metrics artifact written by the evaluation component.
    outputDefinitions:
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      parameters:
        batch_size:
          defaultValue: 32.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        epochs:
          defaultValue: 2.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        learning_rate:
          defaultValue: 0.001
          isOptional: true
          parameterType: NUMBER_DOUBLE
        n_train:
          defaultValue: 256.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        n_val:
          defaultValue: 64.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        seed:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - evaluate-model
        - --model-dir
        - '{{$.inputs.artifacts[''model''].path}}'
        - --metrics-path
        - '{{$.outputs.parameters[''metrics_artifact''].output_file}}'
        - --seed
        - '{{$.inputs.parameters[''seed'']}}'
        - --device
        - cpu
        - --n-train
        - '{{$.inputs.parameters[''n_train'']}}'
        - --n-val
        - '{{$.inputs.parameters[''n_val'']}}'
        - --batch-size
        - '{{$.inputs.parameters[''batch_size'']}}'
        command:
        - uv
        - run
        - kbd
        image: kubeflow-by-doing/train:local
    exec-promote-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - promote_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef promote_model(\n    model: Input[Model],\n    promotion: Output[Artifact],\n\
          \    accuracy: float,\n    min_accuracy: float = 0.8,\n) -> None:\n    \"\
          \"\"Write a promotion artifact when a model clears the accuracy gate.\n\n\
          \    Args:\n        model: Trained model artifact produced by the training\
          \ component.\n        promotion: Output artifact that records the promotion\
          \ decision.\n        accuracy: Evaluation accuracy for the trained model.\n\
          \        min_accuracy: Minimum accuracy required before the model is promoted.\n\
          \    \"\"\"\n    import json\n    from pathlib import Path\n\n    promotion_path\
          \ = Path(promotion.path)\n    promotion_path.parent.mkdir(parents=True,\
          \ exist_ok=True)\n    promotion_path.write_text(\n        json.dumps(\n\
          \            {\n                \"status\": \"promoted\",\n            \
          \    \"accuracy\": accuracy,\n                \"min_accuracy\": min_accuracy,\n\
          \                \"model_uri\": model.uri,\n            },\n           \
          \ indent=2,\n        ),\n        encoding=\"utf-8\",\n    )\n\n"
        image: python:3.12-slim
    exec-read-accuracy:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - read_accuracy
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef read_accuracy(metrics: Input[Artifact]) -> float:\n    \"\"\"\
          Read the accuracy from a metrics artifact.\n\n    Args:\n        metrics:\
          \ Metrics artifact written by the evaluation component.\n\n    Returns:\n\
          \        The accuracy.\n    \"\"\"\n    import json\n    from pathlib import\
          \ Path\n\n    metrics_data: dict[str, Any] = json.loads(Path(metrics.path).read_text(\"\
          utf-8\"))\n    return float(metrics_data.get(\"accuracy\", 0))\n\n"
        image: python:3.12-slim
    exec-train-model:
      container:
        args:
        - train-model
        - --output-dir
        - '{{$.outputs.artifacts[''model''].path}}'
        - --epochs
        - '{{$.inputs.parameters[''epochs'']}}'
        - --learning-rate
        - '{{$.inputs.parameters[''learning_rate'']}}'
        - --seed
        - '{{$.inputs.parameters[''seed'']}}'
        - --device
        - cpu
        - --n-train
        - '{{$.inputs.parameters[''n_train'']}}'
        - --n-val
        - '{{$.inputs.parameters[''n_val'']}}'
        - --batch-size
        - '{{$.inputs.parameters[''batch_size'']}}'
        command:
        - uv
        - run
        - kbd
        image: kubeflow-by-doing/train:local
pipelineInfo:
  description: Define the local image classification pipeline.
  name: image-classification-local
root:
  dag:
    tasks:
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - read-accuracy
        - train-model
        inputs:
          artifacts:
            pipelinechannel--train-model-model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model
          parameters:
            pipelinechannel--min_accuracy:
              componentInputParameter: min_accuracy
            pipelinechannel--read-accuracy-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: read-accuracy
        taskInfo:
          name: condition-1
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--read-accuracy-Output']
            >= inputs.parameter_values['pipelinechannel--min_accuracy']
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - train-model
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model
          parameters:
            batch_size:
              componentInputParameter: batch_size
            n_train:
              componentInputParameter: n_train
            n_val:
              componentInputParameter: n_val
            seed:
              componentInputParameter: seed
        taskInfo:
          name: evaluate-model
      read-accuracy:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-read-accuracy
        dependentTasks:
        - evaluate-model
        inputs:
          artifacts:
            metrics:
              taskOutputArtifact:
                outputArtifactKey: metrics_artifact
                producerTask: evaluate-model
        taskInfo:
          name: read-accuracy
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        inputs:
          parameters:
            batch_size:
              componentInputParameter: batch_size
            epochs:
              componentInputParameter: epochs
            learning_rate:
              componentInputParameter: learning_rate
            n_train:
              componentInputParameter: n_train
            n_val:
              componentInputParameter: n_val
            seed:
              componentInputParameter: seed
        taskInfo:
          name: train-model
  inputDefinitions:
    parameters:
      batch_size:
        defaultValue: 32.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      epochs:
        defaultValue: 2.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      learning_rate:
        defaultValue: 0.001
        isOptional: true
        parameterType: NUMBER_DOUBLE
      min_accuracy:
        defaultValue: 0.8
        isOptional: true
        parameterType: NUMBER_DOUBLE
      n_train:
        defaultValue: 256.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      n_val:
        defaultValue: 64.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      seed:
        defaultValue: 42.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
