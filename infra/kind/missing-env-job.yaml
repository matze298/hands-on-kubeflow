apiVersion: batch/v1
kind: Job
metadata:
  name: missing-env-job
  namespace: kubeflow-by-doing
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: python:3.12-slim
          command:
            - python
            - -c
            - |
              import os
              print(os.environ["DATASET_URI"])
