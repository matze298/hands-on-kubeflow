site_name: Kubeflow by Doing
site_description: A local-first, GPU-aware, hands-on tutorial for Kubeflow, Kubernetes, and practical MLOps.
site_url: https://matze298.github.io/hands-on-kubeflow/

repo_name: hands-on-kubeflow
repo_url: https://github.com/matze298/hands-on-kubeflow

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

