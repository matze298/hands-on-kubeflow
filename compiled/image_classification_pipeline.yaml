# PIPELINE DEFINITION
# Name: image-classification-local
# Description: Define the local image classification pipeline.
# Inputs:
#    batch_size: int [Default: 32.0]
#    epochs: int [Default: 2.0]
#    learning_rate: float [Default: 0.001]
#    n_train: int [Default: 256.0]
#    n_val: int [Default: 64.0]
#    seed: int [Default: 42.0]
components:
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        batch_size:
          defaultValue: 32.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        n_train:
          defaultValue: 256.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        n_val:
          defaultValue: 64.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        seed:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        metrics_artifact:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      parameters:
        batch_size:
          defaultValue: 32.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        epochs:
          defaultValue: 2.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        learning_rate:
          defaultValue: 0.001
          isOptional: true
          parameterType: NUMBER_DOUBLE
        n_train:
          defaultValue: 256.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        n_val:
          defaultValue: 64.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        seed:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - evaluate-model
        - --model-dir
        - '{{$.inputs.artifacts[''model''].path}}'
        - --metrics-path
        - '{{$.outputs.parameters[''metrics_artifact''].output_file}}'
        - --seed
        - '{{$.inputs.parameters[''seed'']}}'
        - --device
        - cuda
        - --n-train
        - '{{$.inputs.parameters[''n_train'']}}'
        - --n-val
        - '{{$.inputs.parameters[''n_val'']}}'
        - --batch-size
        - '{{$.inputs.parameters[''batch_size'']}}'
        command:
        - uv
        - run
        - kbd
        image: kubeflow-by-doing/train:local
    exec-train-model:
      container:
        args:
        - train-model
        - --output-dir
        - '{{$.outputs.artifacts[''model''].path}}'
        - --epochs
        - '{{$.inputs.parameters[''epochs'']}}'
        - --learning-rate
        - '{{$.inputs.parameters[''learning_rate'']}}'
        - --seed
        - '{{$.inputs.parameters[''seed'']}}'
        - --device
        - cuda
        - --n-train
        - '{{$.inputs.parameters[''n_train'']}}'
        - --n-val
        - '{{$.inputs.parameters[''n_val'']}}'
        - --batch-size
        - '{{$.inputs.parameters[''batch_size'']}}'
        command:
        - uv
        - run
        - kbd
        image: kubeflow-by-doing/train:local
pipelineInfo:
  description: Define the local image classification pipeline.
  name: image-classification-local
root:
  dag:
    tasks:
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - train-model
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model
          parameters:
            batch_size:
              componentInputParameter: batch_size
            n_train:
              componentInputParameter: n_train
            n_val:
              componentInputParameter: n_val
            seed:
              componentInputParameter: seed
        taskInfo:
          name: evaluate-model
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        inputs:
          parameters:
            batch_size:
              componentInputParameter: batch_size
            epochs:
              componentInputParameter: epochs
            learning_rate:
              componentInputParameter: learning_rate
            n_train:
              componentInputParameter: n_train
            n_val:
              componentInputParameter: n_val
            seed:
              componentInputParameter: seed
        taskInfo:
          name: train-model
  inputDefinitions:
    parameters:
      batch_size:
        defaultValue: 32.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      epochs:
        defaultValue: 2.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      learning_rate:
        defaultValue: 0.001
        isOptional: true
        parameterType: NUMBER_DOUBLE
      n_train:
        defaultValue: 256.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      n_val:
        defaultValue: 64.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      seed:
        defaultValue: 42.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
