apiVersion: batch/v1
kind: Job
metadata:
  name: parameterized-ml-job
  namespace: kubeflow-by-doing
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: python:3.12-slim
          env:
            - name: EPOCHS
              value: "3"
            - name: LEARNING_RATE
              value: "0.001"
          command:
            - python
            - -c
            - |
              import os

              epochs = int(os.environ["EPOCHS"])
              lr = float(os.environ["LEARNING_RATE"])

              print(f"training for {epochs=} with {lr=}")

              for epoch in range(1, epochs + 1):
                  print(f"epoch={epoch} loss={1.0 / epoch:.4f}")

              print("done")
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
