# PIPELINE DEFINITION
# Name: hello-pipeline
# Description: Defines the pipeline.
# Inputs:
#    name: str [Default: 'kubeflow']
components:
  comp-create-message:
    executorLabel: exec-create-message
    inputDefinitions:
      parameters:
        name:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-print-message:
    executorLabel: exec-print-message
    inputDefinitions:
      parameters:
        message:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-create-message:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - create_message
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef create_message(name: str) -> str:\n    \"\"\"Create a message.\n\
          \n    Returns:\n        The message.\n    \"\"\"\n    return f\"hello, {name}\"\
          \n\n"
        image: python:3.12-slim
    exec-print-message:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - print_message
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef print_message(message: str) -> None:\n    \"\"\"Prints a message.\"\
          \"\"\n    print(message)  # noqa:T201\n\n"
        image: python:3.12-slim
pipelineInfo:
  description: Defines the pipeline.
  name: hello-pipeline
root:
  dag:
    tasks:
      create-message:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-create-message
        inputs:
          parameters:
            name:
              componentInputParameter: name
        taskInfo:
          name: create-message
      print-message:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-print-message
        dependentTasks:
        - create-message
        inputs:
          parameters:
            message:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: create-message
        taskInfo:
          name: print-message
  inputDefinitions:
    parameters:
      name:
        defaultValue: kubeflow
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
