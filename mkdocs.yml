site_name: Kubeflow by Doing
site_description: A local-first, GPU-aware, hands-on tutorial for Kubeflow, Kubernetes, and practical MLOps.
site_url: https://matze298.github.io/hands-on-kubeflow/

repo_name: hands-on-kubeflow
repo_url: https://github.com/matze298/hands-on-kubeflow

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - 0. Orientation:
      - Syllabus: 00-orientation/00-syllabus.md
      - Reader Contract: 00-orientation/01-reader-contract.md
      - Authoring Contract: 00-orientation/02-authoring-contract.md
      - Course Architecture: 00-orientation/03-course-architecture.md
  - 1. Local Kubernetes:
      - Overview: 01-local-kubernetes/00-overview.md
      - Install the Local Toolchain: 01-local-kubernetes/01-install-toolchain.md
      - Create a Local Kubernetes Cluster: 01-local-kubernetes/02-create-local-cluster.md
      - First Kubernetes Job: 01-local-kubernetes/03-first-kubernetes-job.md
      - Kubernetes Debugging Basics: 01-local-kubernetes/04-debugging-basics.md
      - GPU Smoke Test: 01-local-kubernetes/05-gpu-smoke-test.md
  - 2. Kubeflow Pipelines:
